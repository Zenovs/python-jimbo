name: Release

# Läuft bei einem Tag wie v1.0.0: baut die .exe und hängt sie an das Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: JiimbosPowerApp.exe bauen
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: .exe bauen
        run: >
          python -m PyInstaller
          --onefile --windowed --clean --noconfirm
          --name JiimbosPowerApp
          --icon assets/icon.ico
          --paths src
          --add-data "assets/icon.ico;assets"
          --exclude-module tkinter
          --exclude-module pytest
          --exclude-module PyInstaller
          launcher.py

      - name: Prüfen, ob die .exe startet
        env:
          JIMBO_SELFTEST: "1"
        run: |
          & "dist\JiimbosPowerApp.exe"
          if ($LASTEXITCODE -ne 0) { throw "Die .exe startet nicht (Exit-Code $LASTEXITCODE)." }
          $mb = [math]::Round((Get-Item "dist\JiimbosPowerApp.exe").Length / 1MB, 1)
          Write-Host "JiimbosPowerApp.exe ist $mb MB gross."

      - name: Als Bauergebnis ablegen
        uses: actions/upload-artifact@v4
        with:
          name: JiimbosPowerApp-exe
          path: dist/JiimbosPowerApp.exe

      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Jiimbos Power App $tag" --generate-notes
          }
          gh release upload $tag "dist\JiimbosPowerApp.exe" --clobber
