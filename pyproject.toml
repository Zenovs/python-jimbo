[project]
name = "jimbo"
version = "0.1.0"
description = "Jiimbos Power App – Python-Programme per Beschreibung erzeugen lassen"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "anthropic==1.3.0",
    "PySide6==6.11.2",
    "keyring==25.7.0",
]

[project.scripts]
jimbo = "jimbo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
